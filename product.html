<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Zayta Cosmétique</title></head><body>
<header><div class="wrap"><a class="logo" href="index.html">Zayta<small>Cosmétique</small></a></div></header>
<main class="wrap"><div id="box" class="product"><p>Chargement…</p></div></main>
<footer><div class="wrap"><a href="index.html">Retour aux produits</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
(async()=>{
 const id=new URLSearchParams(location.search).get("id"), box=$("#box");
 const {data:p}=await sb.from("products").select("*").eq("id",id).eq("active",true).maybeSingle();
 box.replaceChildren();
 if(!p){box.append(el("p",{text:"Produit introuvable."}));return}
 document.title=p.name+" · Zayta Cosmétique";
 const f=el("form",{class:"order"});
 f.innerHTML='<h2 style="font-size:32px;margin:0">Commander</h2>'
  +'<label>Nom complet<input name="customer_name" required autocomplete="name"></label>'
  +'<label>Téléphone<input name="phone" required inputmode="tel" autocomplete="tel" pattern="0[5-7][0-9]{8}" placeholder="0612345678"></label>'
  +'<label>Ville<input name="city" required autocomplete="address-level2"></label>'
  +'<label>Adresse de livraison<textarea name="address" required rows="2"></textarea></label>'
  +'<label>Quantité<input name="quantity" type="number" min="1" max="20" value="1" required></label>'
  +'<input class="hp" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">'
  +'<button class="btn" type="submit">Commander · paiement à la livraison</button>'
  +'<p class="note">Vous payez en espèces à la réception. Nous vous appelons pour confirmer.</p><div id="out" role="status"></div>';
 f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),out=$("#out"),b=f.querySelector("button");
  if(d.site)return; b.disabled=true;
  const {error}=await sb.from("orders").insert({product_id:p.id,customer_name:d.customer_name.trim(),phone:d.phone,city:d.city.trim(),address:d.address.trim(),quantity:+d.quantity});
  if(error){b.disabled=false;out.className="msg err";out.textContent="La commande n'a pas été envoyée. Vérifiez vos informations et réessayez.";return}
  f.replaceChildren(el("div",{class:"msg",text:"Merci ! Votre commande est enregistrée. Nous vous appelons très vite pour la confirmer."}));};
 box.append(el("div",{class:"ph"},p.image_url?el("img",{src:p.image_url,alt:p.name}):""),
  el("div",{},el("h1",{text:p.name}),el("div",{class:"price",text:mad(p.price)}),el("p",{text:p.description||""}),f));
})();
</script></body></html>
