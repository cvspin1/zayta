<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Dashboard · Zayta</title></head><body>
<header><div class="wrap"><a class="logo" href="index.html">Zayta<small>Dashboard</small></a><button class="btn ghost sm" id="out" hidden>Se déconnecter</button></div></header>
<main class="wrap" id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
const app = $("#app"), STATUS = ["Nouvelle","Confirmée","Expédiée","Livrée","Annulée"];
let current = "o", body = null, bO = null, known = null, unseen = 0, timer = null, chan = null;
const baseTitle = document.title;
$("#out").onclick = async () => { await sb.auth.signOut(); location.reload(); };

function loginView() {
  const f = el("form", {class:"login"});
  f.innerHTML = '<h2 style="font-size:36px;margin:0">Connexion</h2><label>Email<input name="e" type="email" required autocomplete="username"></label><label>Mot de passe<input name="p" type="password" required autocomplete="current-password"></label><button class="btn">Se connecter</button><div id="m" role="alert"></div>';
  f.onsubmit = async ev => {
    ev.preventDefault();
    const {error} = await sb.auth.signInWithPassword({email:f.e.value, password:f.p.value});
    if (error) { $("#m").className = "msg err"; $("#m").textContent = "Email ou mot de passe incorrect."; } else start();
  };
  app.replaceChildren(f);
}

/* ---------- Alerte nouvelle commande ---------- */
function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .15;
    o.start(); o.stop(c.currentTime + .25); setTimeout(() => { o.frequency.value = 1175; }, 130);
  } catch {}
}
function badge() {
  bO.replaceChildren("Commandes", ...(unseen ? [el("span", {class:"badge", text:String(unseen)})] : []));
  document.title = unseen ? "(" + unseen + ") Nouvelle commande · Zayta" : baseTitle;
}
function toast(o, n) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const b = el("button", {class:"btn ghost sm", text:"Voir"});
  const t = el("div", {class:"toast", role:"status", text:"🔔 " + (n > 1 ? n + " nouvelles commandes" : "Nouvelle commande de " + o.customer_name + " · " + mad(o.total || 0))}, b);
  b.onclick = () => { t.remove(); show("o"); };
  document.body.append(t); setTimeout(() => t.remove(), 12000);
}
async function checkNew() {
  const {data, count, error} = await sb.from("orders").select("id,customer_name,total", {count:"exact"}).order("created_at", {ascending:false}).limit(1);
  if (error || count == null) return;
  if (known === null) { known = count; return; }
  if (count > known) {
    const n = count - known; known = count; unseen += n; badge(); beep(); toast(data[0], n);
    if (current === "o") orders(body);
  } else known = count;
}
function startWatching() {
  if (chan) return;
  chan = sb.channel("orders-live").on("postgres_changes", {event:"INSERT", schema:"public", table:"orders"}, checkNew).subscribe();
  timer = setInterval(checkNew, 20000);   // filet de sécurité si le temps réel est coupé
  checkNew();
}

async function start() {
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return loginView();
  $("#out").hidden = false;
  body = el("div"); const tabs = el("div", {class:"tabs"});
  bO = el("button", {"aria-pressed":"true"}); const bS = el("button", {text:"Statistiques", "aria-pressed":"false"}), bP = el("button", {text:"Produits", "aria-pressed":"false"});
  tabs.append(bO, bS, bP); app.replaceChildren(tabs, body);
  window.show = async w => {
    current = w;
    bO.setAttribute("aria-pressed", w === "o"); bS.setAttribute("aria-pressed", w === "s"); bP.setAttribute("aria-pressed", w === "p");
    if (w === "o") { unseen = 0; badge(); await orders(body); } else if (w === "s") await stats(body); else await products(body);
  };
  bO.onclick = () => show("o"); bS.onclick = () => show("s"); bP.onclick = () => show("p");
  badge(); show("o"); startWatching();
}

async function orders(root) {
  const {data, error} = await sb.from("orders").select("*").order("created_at", {ascending:false});
  if (error) return root.replaceChildren(el("p", {class:"msg err", text:"Impossible de charger les commandes."}));
  if (!data.length) return root.replaceChildren(el("p", {text:"Aucune commande pour le moment. Elles apparaîtront ici dès la première, sans rafraîchir la page."}));
  const t = el("table"), th = el("tr");
  ["Date","Client","Livraison","Produit","Total","Statut"].forEach(h => th.append(el("th", {text:h})));
  t.append(el("thead", {}, th));
  const tb = el("tbody");
  data.forEach(o => {
    const sel = el("select", {"aria-label":"Statut de la commande"});
    STATUS.forEach(s => { const op = el("option", {text:s}); if (s === o.status) op.selected = true; sel.append(op); });
    const tr = el("tr", o.status === "Nouvelle" ? {class:"new"} : {});
    sel.onchange = async () => { const {error} = await sb.from("orders").update({status:sel.value}).eq("id", o.id); if (error) alert("Statut non enregistré. Réessayez."); else tr.className = sel.value === "Nouvelle" ? "new" : ""; };
    const ph = o.phone.replace(/^0/, "");
    const wa = "https://wa.me/212" + ph + "?text=" + encodeURIComponent("Bonjour " + o.customer_name + ", c'est Zayta Cosmétique. Nous confirmons votre commande : " + o.product_name + " × " + o.quantity + " (" + mad(o.total) + ", paiement à la livraison). Livraison à " + o.city + ". C'est bien correct ?");
    tr.append(
      el("td", {text:new Date(o.created_at).toLocaleString("fr-FR", {dateStyle:"short", timeStyle:"short"})}),
      el("td", {}, el("strong", {text:o.customer_name}), el("br"), el("a", {href:"tel:" + o.phone, text:o.phone}), " ", el("a", {href:wa, target:"_blank", rel:"noopener", text:"WhatsApp"})),
      el("td", {text:o.city + " – " + o.address}),
      el("td", {text:o.product_name + " × " + o.quantity}),
      el("td", {text:mad(o.total)}),
      el("td", {}, sel));
    tb.append(tr);
  });
  t.append(tb);
  root.replaceChildren(el("div", {class:"scroll"}, t));
}

async function stats(root) {
  root.replaceChildren(el("p", {text:"Chargement…"}));
  const days = 30;
  const {data:s, error} = await sb.rpc("admin_stats", {days});
  if (error || !s) return root.replaceChildren(el("p", {class:"msg err", text:"Statistiques indisponibles. Exécutez update.sql dans Supabase (voir LISEZ-MOI)."}));
  const card = (n, l) => el("div", {class:"stat"}, el("b", {text:String(n)}), el("span", {text:l}));
  const cards = el("div", {class:"stats"}, card(s.today_visitors, "Visiteurs aujourd'hui"), card(s.visitors, "Visiteurs (" + days + " jours)"), card(s.orders, "Commandes"), card(mad(s.revenue), "Chiffre d'affaires"), card(s.whatsapp, "Clics WhatsApp"));
  const steps = [["Ont visité le site", s.visitors], ["Ont ouvert un produit", s.viewers], ["Ont rempli le formulaire", s.order_starts], ["Ont commandé", s.orders]];
  const max = Math.max(1, ...steps.map(x => x[1]));
  const fun = el("div", {class:"funnel"});
  steps.forEach(([l, n]) => fun.append(el("div", {}, el("span", {text:l}), el("i", {style:"width:" + Math.max(1, n / max * 100) + "%"}), el("b", {text:String(n)}))));
  const list = (rows, a, b) => { const ul = el("div", {class:"funnel"}); const m = Math.max(1, ...rows.map(r => r[b])); rows.forEach(r => ul.append(el("div", {}, el("span", {text:r[a]}), el("i", {style:"width:" + Math.max(1, r[b] / m * 100) + "%"}), el("b", {text:String(r[b])})))); return ul; };
  root.replaceChildren(cards,
    el("h2", {class:"sub", text:"Parcours des clients (" + days + " derniers jours)"}), fun,
    el("h2", {class:"sub", text:"Produits les plus consultés"}), s.top_products.length ? list(s.top_products, "name", "views") : el("p", {text:"Pas encore de données."}),
    el("h2", {class:"sub", text:"Téléphone ou ordinateur"}), s.devices.length ? list(s.devices.map(d => ({name:d.device === "mobile" ? "Téléphone" : "Ordinateur", n:d.n})), "name", "n") : el("p", {text:"Pas encore de données."}),
    el("h2", {class:"sub", text:"Visiteurs par jour"}), s.daily.length ? list(s.daily.map(d => ({name:new Date(d.d).toLocaleDateString("fr-FR", {day:"2-digit", month:"short"}), n:d.v})), "name", "n") : el("p", {text:"Pas encore de données."}));
}

async function products(root) {
  root.replaceChildren(el("p", {text:"Chargement…"}));
  const {data = []} = await sb.from("products").select("*").order("created_at");
  const f = el("form", {class:"order"}); let editing = null;
  f.innerHTML = '<h2 style="font-size:32px;margin:0" id="ft">Ajouter un produit</h2><label>Nom<input name="name" required></label><label>Prix (MAD)<input name="price" type="number" min="0" step="1" required></label><label>Description<textarea name="description" rows="3"></textarea></label><label>Photo<input name="file" type="file" accept="image/*"></label><label class="row"><input type="checkbox" name="active" checked style="width:auto"> Visible sur le site</label><div class="row"><button class="btn">Enregistrer</button><button type="button" class="btn ghost" id="cancel" hidden>Annuler</button></div><div id="m" role="status"></div>';
  f.onsubmit = async ev => {
    ev.preventDefault(); const m = $("#m"); m.className = ""; m.textContent = "Enregistrement…";
    let image_url = editing ? editing.image_url : null;
    const file = f.file.files[0];
    if (file) {
      const path = Date.now() + "-" + file.name.replace(/[^\w.]/g, "_");
      const up = await sb.storage.from("products").upload(path, file);
      if (up.error) { m.className = "msg err"; m.textContent = "La photo n'a pas été envoyée."; return; }
      image_url = sb.storage.from("products").getPublicUrl(path).data.publicUrl;
    }
    const row = {name:f.name.value.trim(), price:+f.price.value, description:f.description.value.trim(), active:f.active.checked, image_url};
    const {error} = editing ? await sb.from("products").update(row).eq("id", editing.id) : await sb.from("products").insert(row);
    if (error) { m.className = "msg err"; m.textContent = "Produit non enregistré."; } else products(root);
  };
  const list = el("div", {class:"scroll"}), t = el("table");
  const th = el("tr"); ["Produit","Prix","Visible",""].forEach(h => th.append(el("th", {text:h}))); t.append(el("thead", {}, th));
  const tb = el("tbody");
  data.forEach(p => {
    const ed = el("button", {class:"btn ghost sm", text:"Modifier"}), del = el("button", {class:"btn ghost sm", text:"Supprimer"});
    ed.onclick = () => { editing = p; f.name.value = p.name; f.price.value = p.price; f.description.value = p.description || ""; f.active.checked = p.active; $("#ft").textContent = "Modifier le produit"; $("#cancel").hidden = false; f.scrollIntoView(); };
    del.onclick = async () => { if (confirm("Supprimer « " + p.name + " » ? Les anciennes commandes sont conservées.")) { await sb.from("products").delete().eq("id", p.id); products(root); } };
    tb.append(el("tr", {}, el("td", {text:p.name}), el("td", {text:mad(p.price)}), el("td", {text:p.active ? "Oui" : "Non"}), el("td", {}, el("div", {class:"row"}, ed, del))));
  });
  t.append(tb); list.append(t);
  root.replaceChildren(list, el("div", {style:"height:32px"}), f);
  $("#cancel").onclick = () => products(root);
}
start();
</script></body></html>
