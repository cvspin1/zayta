<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Dashboard · Zayta</title></head><body>
<header><div class="wrap"><a class="logo" href="index.html">Zayta<small>Dashboard</small></a><button class="btn ghost sm" id="out" hidden>Se déconnecter</button></div></header>
<main class="wrap" id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script>
<script>
const app = $("#app"), STATUS = ["Nouvelle","Confirmée","Expédiée","Livrée","Annulée"];
$("#out").onclick = async () => { await sb.auth.signOut(); location.reload(); };

function loginView() {
  const f = el("form", {class:"login"});
  f.innerHTML = '<h2 style="font-size:36px;margin:0">Connexion</h2><label>Email<input name="e" type="email" required autocomplete="username"></label><label>Mot de passe<input name="p" type="password" required autocomplete="current-password"></label><button class="btn">Se connecter</button><div id="m" role="alert"></div>';
  f.onsubmit = async ev => {
    ev.preventDefault();
    const {error} = await sb.auth.signInWithPassword({email:f.e.value, password:f.p.value});
    if (error) { $("#m").className = "msg err"; $("#m").textContent = "Email ou mot de passe incorrect."; } else start();
  };
  app.replaceChildren(f);
}

async function start() {
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return loginView();
  $("#out").hidden = false;
  const body = el("div"), tabs = el("div", {class:"tabs"});
  const bO = el("button", {text:"Commandes", "aria-pressed":"true"}), bP = el("button", {text:"Produits", "aria-pressed":"false"});
  tabs.append(bO, bP); app.replaceChildren(tabs, body);
  const show = async w => { bO.setAttribute("aria-pressed", w==="o"); bP.setAttribute("aria-pressed", w==="p"); w==="o" ? await orders(body) : await products(body); };
  bO.onclick = () => show("o"); bP.onclick = () => show("p"); show("o");
}

async function orders(root) {
  root.replaceChildren(el("p", {text:"Chargement…"}));
  const {data, error} = await sb.from("orders").select("*").order("created_at", {ascending:false});
  if (error) return root.replaceChildren(el("p", {class:"msg err", text:"Impossible de charger les commandes."}));
  if (!data.length) return root.replaceChildren(el("p", {text:"Aucune commande pour le moment. Elles apparaîtront ici dès la première."}));
  const t = el("table"), th = el("tr");
  ["Date","Client","Livraison","Produit","Total","Statut"].forEach(h => th.append(el("th", {text:h})));
  t.append(el("thead", {}, th));
  const tb = el("tbody");
  data.forEach(o => {
    const sel = el("select", {"aria-label":"Statut de la commande"});
    STATUS.forEach(s => { const op = el("option", {text:s}); if (s === o.status) op.selected = true; sel.append(op); });
    sel.onchange = async () => { const {error} = await sb.from("orders").update({status:sel.value}).eq("id", o.id); if (error) alert("Statut non enregistré. Réessayez."); };
    const wa = "https://wa.me/212" + o.phone.replace(/^0/, "");
    tb.append(el("tr", {},
      el("td", {text:new Date(o.created_at).toLocaleString("fr-FR", {dateStyle:"short", timeStyle:"short"})}),
      el("td", {}, el("strong", {text:o.customer_name}), el("br"), el("a", {href:"tel:"+o.phone, text:o.phone}), " ", el("a", {href:wa, target:"_blank", rel:"noopener", text:"WhatsApp"})),
      el("td", {text:o.city + " – " + o.address}),
      el("td", {text:o.product_name + " × " + o.quantity}),
      el("td", {text:mad(o.total)}),
      el("td", {}, sel)));
  });
  t.append(tb);
  root.replaceChildren(el("div", {class:"scroll"}, t));
}

async function products(root) {
  root.replaceChildren(el("p", {text:"Chargement…"}));
  const {data = []} = await sb.from("products").select("*").order("created_at");
  const f = el("form", {class:"order"}); let editing = null;
  f.innerHTML = '<h2 style="font-size:32px;margin:0" id="ft">Ajouter un produit</h2><label>Nom<input name="name" required></label><label>Prix (MAD)<input name="price" type="number" min="0" step="1" required></label><label>Description<textarea name="description" rows="3"></textarea></label><label>Photo<input name="file" type="file" accept="image/*"></label><label>Audio de présentation (15 s, 3 Mo max)<input name="audio" type="file" accept="audio/*"></label><label class="row"><input type="checkbox" name="active" checked style="width:auto"> Visible sur le site</label><div class="row"><button class="btn">Enregistrer</button><button type="button" class="btn ghost" id="cancel" hidden>Annuler</button></div><div id="m" role="status"></div>';
  f.onsubmit = async ev => {
    ev.preventDefault(); const m = $("#m"); m.className = ""; m.textContent = "Enregistrement…";
    let image_url = editing ? editing.image_url : null;
    const file = f.file.files[0];
    if (file) {
      const path = Date.now() + "-" + file.name.replace(/[^\w.]/g, "_");
      const up = await sb.storage.from("products").upload(path, file);
      if (up.error) { m.className = "msg err"; m.textContent = "La photo n'a pas été envoyée."; return; }
      image_url = sb.storage.from("products").getPublicUrl(path).data.publicUrl;
    }
    let audio_url = editing ? editing.audio_url : null;
    const af = f.audio.files[0];
    if (af) {
      if (af.size > 3e6) { m.className = "msg err"; m.textContent = "L'audio est trop lourd (3 Mo maximum)."; return; }
      const ap = Date.now() + "-" + af.name.replace(/[^\w.]/g, "_");
      const au = await sb.storage.from("products").upload(ap, af);
      if (au.error) { m.className = "msg err"; m.textContent = "L'audio n'a pas été envoyé."; return; }
      audio_url = sb.storage.from("products").getPublicUrl(ap).data.publicUrl;
    }
    const row = {name:f.name.value.trim(), price:+f.price.value, description:f.description.value.trim(), active:f.active.checked, image_url, audio_url};
    const {error} = editing ? await sb.from("products").update(row).eq("id", editing.id) : await sb.from("products").insert(row);
    if (error) { m.className = "msg err"; m.textContent = "Produit non enregistré."; } else products(root);
  };
  const list = el("div", {class:"scroll"}), t = el("table");
  const th = el("tr"); ["Produit","Prix","Visible",""].forEach(h => th.append(el("th", {text:h}))); t.append(el("thead", {}, th));
  const tb = el("tbody");
  data.forEach(p => {
    const ed = el("button", {class:"btn ghost sm", text:"Modifier"}), del = el("button", {class:"btn ghost sm", text:"Supprimer"});
    ed.onclick = () => { editing = p; f.name.value = p.name; f.price.value = p.price; f.description.value = p.description || ""; f.active.checked = p.active; $("#ft").textContent = "Modifier le produit"; $("#cancel").hidden = false; f.scrollIntoView(); };
    del.onclick = async () => { if (confirm("Supprimer « " + p.name + " » ? Les anciennes commandes sont conservées.")) { await sb.from("products").delete().eq("id", p.id); products(root); } };
    tb.append(el("tr", {}, el("td", {text:p.name}), el("td", {text:mad(p.price)}), el("td", {text:p.active ? "Oui" : "Non"}), el("td", {}, el("div", {class:"row"}, ed, del))));
  });
  t.append(tb); list.append(t);
  root.replaceChildren(list, el("div", {style:"height:32px"}), f);
  $("#cancel").onclick = () => products(root);
}
start();
</script></body></html>
